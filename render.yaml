# ApplyIQ — Render blueprint
#
# CLIENT_URL is REQUIRED, not optional: server/src/app.js throws at import time
# when it is missing, so the API process exits on boot rather than starting in a
# broken state. lib/io.js reads the same variable for the Socket.IO CORS origin.
#
# Chicken-and-egg: CLIENT_URL and VITE_API_URL are each other's public URLs, and
# neither is known until after the first sync creates the services. Expect the
# first deploy of applyiq-api to fail on a missing CLIENT_URL. Once both services
# exist, set each value in the Render dashboard and redeploy both.

services:
  # ---------------------------------------------------------------- API
  - type: web
    runtime: node
    name: applyiq-api
    rootDir: server
    # Explicit: omitting `plan` provisions a billed Starter instance.
    plan: free
    # Migrations run here because preDeployCommand is not available on free
    # instances. `migrate deploy` applies committed migrations only — it never
    # prompts and never resets, unlike `migrate dev`.
    buildCommand: "npm ci && npm run build && npx prisma migrate deploy"
    startCommand: "npm start"
    healthCheckPath: "/api/health"
    envVars:
      # Postgres connection string (src/lib/prisma.js). Without it every query
      # fails and the build's migrate step fails too.
      - key: DATABASE_URL
        sync: false
      # The deployed applyiq-web URL. src/app.js throws at import without it.
      - key: CLIENT_URL
        sync: false
      # Generated by Render, never committed. Changing it invalidates every
      # issued token, logging all users out.
      - key: JWT_SECRET
        generateValue: true
      # src/services/openai.js throws at import without it, which stops the
      # whole server booting — not just the AI routes.
      - key: OPENAI_API_KEY
        sync: false
      # Not a secret: a literal keeps the logger at `info` instead of `debug`
      # without anyone having to remember to type it in the dashboard.
      - key: NODE_ENV
        value: production
      # Optional. Only read by middleware/authorize.js `apiKeyAuth`, which is
      # not mounted on any route today. Empty means every key is rejected.
      - key: API_KEYS
        sync: false

  # ----------------------------------------------------------- Frontend
  - type: web
    runtime: static
    name: applyiq-web
    rootDir: client
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    routes:
      # SPA fallback: React Router owns the paths, so every unmatched request
      # must serve index.html rather than 404.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The deployed applyiq-api origin — no trailing slash, no /api suffix.
      # Read by src/lib/api.js, which exports it as API_ORIGIN; CoverLetterPage
      # (streaming fetch) and SocketContext (socket origin) both import that.
      # Baked into the bundle at build time, so changing it needs a redeploy,
      # not just a dashboard edit.
      - key: VITE_API_URL
        sync: false
